name: autostop-j1-browser

services:
  renderer:
    build:
      context: ../..
      dockerfile: deploy/j1-browser/Dockerfile
    command: ["-m", "autostop_manager.j1_browser_renderer", "serve", "--socket", "/run/autostop-j1-browser/renderer.sock"]
    user: "10001:10001"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    volumes:
      - type: bind
        source: ${AUTOSTOP_J1_BROWSER_SOCKET_DIR:-/run/autostop-j1-browser}
        target: /run/autostop-j1-browser
    environment:
      AUTOSTOP_J1_BROWSER_SOCKET: /run/autostop-j1-browser/renderer.sock
      AUTOSTOP_J1_BROWSER_ALLOWED_UID: "0"
      AUTOSTOP_J1_BROWSER_PROXY: http://172.31.250.3:18890
      AUTOSTOP_J1_BROWSER_CONTROL_CIDR: 172.31.250.0/29
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 768m
    ulimits:
      nofile:
        soft: 1024
        hard: 1024
    networks:
      j1_browser_control:
        ipv4_address: 172.31.250.2
    depends_on:
      proxy:
        condition: service_started
    restart: unless-stopped

  proxy:
    build:
      context: ../..
      dockerfile: deploy/j1-browser/Dockerfile
    command:
      ["-m", "autostop_manager.j1_browser_proxy", "serve", "--host", "0.0.0.0", "--port", "18890", "--allowed-peer", "172.31.250.2/32"]
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    ulimits:
      nofile:
        soft: 256
        hard: 256
    networks:
      j1_browser_control:
        ipv4_address: 172.31.250.3
      j1_browser_egress: {}
    restart: unless-stopped

networks:
  # Renderer has only this internal bridge.  It can reach only the proxy's
  # static address; no host ports are published by either service.
  j1_browser_control:
    internal: true
    ipam:
      config:
        - subnet: 172.31.250.0/29
  # Only the proxy joins the egress bridge.  It still enforces DNS pinning and
  # public-address validation in code for every upstream connection.
  j1_browser_egress:
    internal: false
