[Service]
Environment=LD_LIBRARY_PATH=/opt/autostop-sqlite/3.51.3/lib
# Preserve the verified canonical dump helper. Reconcile daily buckets only
# after its successful atomic publish; a busy/error receipt retains all files.
ExecStartPost=-/usr/local/sbin/autostop-disk-maintenance pg-retain
ReadWritePaths=/var/lib/autostop-manager/private /var/backups/autostop-complete/.backup.lock
