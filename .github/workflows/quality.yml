name: quality

on:
  pull_request:
  push:
    branches: [AutostopManager]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install hash-locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Lint and format
        run: |
          python -m ruff check .
          python -m ruff format --check autostop_manager tests
      - name: Static types and imports
        run: |
          python -m mypy autostop_manager
          python -m compileall -q autostop_manager
      - name: Tests and branch coverage
        run: |
          python -m coverage run -m pytest -q
          python -m coverage report --fail-under=75
      - name: Dependency and dead-code audits
        run: |
          python -m pip_audit --progress-spinner off
          python -m vulture autostop_manager --min-confidence 80
      - name: Knowledge, documentation, and contract audits
        run: |
          python -m autostop_manager.cli knowledge-sync
          python -m autostop_manager.cli knowledge-audit
          python -m autostop_manager.cli annotations-audit
          python -m autostop_manager.cli skills-audit
          python -m autostop_manager.cli system-audit
