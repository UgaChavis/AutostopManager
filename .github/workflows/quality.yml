name: quality

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and development checks
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Install offline catalog search dependency
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Audit knowledge and documentation contracts
        run: |
          python -m autostop_manager.cli doctor --project-only
          python scripts/update-instruction-catalogs.py --check --project-only
          python scripts/check-automotive-catalog.py
          python scripts/generate-automotive-instructions.py --check

      - name: Lint, format, and type check
        run: |
          python -m ruff check .
          python -m ruff format --check autostop_manager tests
          python -m mypy autostop_manager

      - name: Enforce project and E2 coverage gates
        run: |
          python -m coverage run -m pytest -q
          python -m coverage report --fail-under=82
          python -m coverage json -o "$RUNNER_TEMP/coverage.json"
          python scripts/check-e2-branch-coverage.py "$RUNNER_TEMP/coverage.json"
