name: release-rehearsal

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact approved Manager commit (40 lowercase hex characters)
        required: true
        type: string
  # Bootstrap the runner before this workflow reaches the default branch.
  # Push runs always check the explicitly reviewed PR #126 source below.
  push:
    branches:
      - "codex/manager-release-rehearsal-*"

permissions:
  contents: read

concurrency:
  group: manager-rehearsal-${{ inputs.candidate_sha || 'bfbe58823a11f84fef23fef291f690559d989af0' }}
  cancel-in-progress: false

jobs:
  release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha || 'bfbe58823a11f84fef23fef291f690559d989af0' }}
      WORKFLOW_REVISION: ${{ github.workflow_sha }}
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Validate exact source revision
        shell: bash
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            printf 'candidate_sha_invalid=true\n' >&2
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/manager-rehearsal"

      - name: Check out exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false

      - name: Record source and workflow identities
        working-directory: candidate
        run: |
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
          git diff --exit-code
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          receipt = {
              "format": "autostop.manager.source-rehearsal.v1",
              "source_revision": os.environ["CANDIDATE_SHA"],
              "source_tree": subprocess.check_output(
                  ["git", "rev-parse", "HEAD^{tree}"], text=True
              ).strip(),
              "workflow_revision": os.environ["WORKFLOW_REVISION"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "scope": "source_and_synthetic_tests_only",
              "runtime_acceptance": False,
              "deployment_performed": False,
          }
          target = Path(os.environ["RUNNER_TEMP"]) / "manager-rehearsal/source.json"
          target.write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: candidate/pyproject.toml

      - name: Install isolated development environment
        working-directory: candidate
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"
          .venv/bin/python -m pip freeze --all > "$RUNNER_TEMP/manager-rehearsal/dependencies.txt"
          .venv/bin/python --version > "$RUNNER_TEMP/manager-rehearsal/python.txt"

      - name: Install offline catalog search dependency
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Run canonical release gates
        working-directory: candidate
        run: |
          set +e
          /usr/bin/time -v -o "$RUNNER_TEMP/manager-rehearsal/resources.txt" \
            bash scripts/release-gates.sh \
            > "$RUNNER_TEMP/manager-rehearsal/release-gates.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/manager-rehearsal/release-gates.log"
          printf '%s\n' "$code" > "$RUNNER_TEMP/manager-rehearsal/release-gates.exit-code"
          exit "$code"

      - name: Seal exact source and automotive export
        working-directory: candidate
        run: |
          [[ "$(cat "$RUNNER_TEMP/manager-rehearsal/release-gates.exit-code")" == 0 ]]
          grep -qx 'release_gates_ok=true' "$RUNNER_TEMP/manager-rehearsal/release-gates.log"
          git diff --exit-code
          git diff --cached --exit-code
          git archive --format=tar --prefix=autostop-manager/ "$CANDIDATE_SHA" \
            | gzip -n > "$RUNNER_TEMP/manager-rehearsal/manager-source.tar.gz"
          .venv/bin/python scripts/export-automotive-tools.py \
            --revision "$CANDIDATE_SHA" \
            --output "$RUNNER_TEMP/manager-rehearsal/automotive-tools.json" \
            > "$RUNNER_TEMP/manager-rehearsal/export-receipt.json"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "manager-rehearsal"
          bundle = json.loads((root / "automotive-tools.json").read_text())
          exported = json.loads((root / "export-receipt.json").read_text())
          revision = os.environ["CANDIDATE_SHA"]
          if bundle["source_revision"] != revision or exported["source_revision"] != revision:
              raise SystemExit("export_source_revision_mismatch")
          manifest = json.loads((root / "source.json").read_text())
          manifest.update({
              "canonical_release_gates": True,
              "automotive_content_hash": bundle["content_hash"],
              "files": {
                  path.name: hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in sorted(root.iterdir()) if path.is_file()
              },
          })
          (root / "manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload rehearsal receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manager-rehearsal-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/manager-rehearsal/
          if-no-files-found: warn
          retention-days: 14
