<script>
function submitUnit(model, unit, title) {
 var form = document.getElementById('GetForm');
 form.innerHTML = "<input type=\"hidden\" name=\"Model\">";
 form.innerHTML += "<input type=\"hidden\" name=\"Unit\">";
 form.innerHTML += "<input type=\"hidden\" name=\"Title\">";
 document.forms[1].Model.value = model;
 document.forms[1].Unit.value = unit;
 document.forms[1].Title.value = title;
 document.forms[1].action = "Parts.aspx";
 document.forms[1].submit();
}
</script>
