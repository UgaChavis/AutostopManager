openapi: 3.1.0
info:
  title: Parts Search Gateway
  version: 0.1.0
  description: >
    Внутренний API-шлюз для поиска автозапчастей, скоринга предложений и отчета менеджеру.
    Реальные внешние источники подключаются через разрешенные API и договорные доступы.
servers:
  - url: http://localhost:8080
paths:
  /requests:
    post:
      summary: Создать заявку на запчасть
      operationId: createPartRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartRequest'
      responses:
        '201':
          description: Заявка создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartRequest'
  /requests/{request_id}/queries:
    post:
      summary: Сформировать поисковые запросы по заявке
      operationId: buildQueries
      parameters:
        - in: path
          name: request_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: План запросов
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_queries:
                    type: array
                    items:
                      $ref: '#/components/schemas/SourceQuery'
                  manual_queries:
                    type: array
                    items:
                      type: string
  /search:
    post:
      summary: Выполнить поиск по разрешенным источникам
      operationId: searchParts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_id, source_ids]
              properties:
                request_id:
                  type: string
                source_ids:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Найденные предложения
          content:
            application/json:
              schema:
                type: object
                properties:
                  offers:
                    type: array
                    items:
                      $ref: '#/components/schemas/Offer'
  /offers/manual:
    post:
      summary: Добавить предложение, найденное вручную
      operationId: addManualOffer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Offer'
      responses:
        '201':
          description: Предложение добавлено
  /score:
    post:
      summary: Оценить предложения
      operationId: scoreOffers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_id, mode, offers]
              properties:
                request_id:
                  type: string
                mode:
                  type: string
                  enum: [standard, urgent_today, used_or_contract, electronics]
                offers:
                  type: array
                  items:
                    $ref: '#/components/schemas/Offer'
      responses:
        '200':
          description: Ранжированные предложения
          content:
            application/json:
              schema:
                type: object
                properties:
                  ranked_offers:
                    type: array
                    items:
                      $ref: '#/components/schemas/Offer'
  /reports/{request_id}:
    get:
      summary: Получить отчет для менеджера
      operationId: getReport
      parameters:
        - in: path
          name: request_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Отчет
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchReport'
  /feedback:
    post:
      summary: Записать результат заказа
      operationId: addFeedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderFeedback'
      responses:
        '201':
          description: Обратная связь записана
components:
  schemas:
    PartRequest:
      type: object
      required: [request_id, vehicle, part, constraints]
      properties:
        request_id:
          type: string
        vehicle:
          type: object
        part:
          type: object
        constraints:
          type: object
        missing_fields:
          type: array
          items:
            type: string
        risk_flags:
          type: array
          items:
            type: string
    SourceQuery:
      type: object
      properties:
        source_id:
          type: string
        query_type:
          type: string
        article:
          type: string
        brand:
          type: string
        include_crosses:
          type: boolean
    Offer:
      type: object
      required: [offer_id, source_id, brand, article, price_rub]
      properties:
        offer_id:
          type: string
        source_id:
          type: string
        source_type:
          type: string
        seller_id:
          type: string
        seller_name:
          type: string
        seller_city:
          type: string
        brand:
          type: string
        article:
          type: string
        name:
          type: string
        condition:
          type: string
        price_rub:
          type: number
        delivery_cost_rub:
          type: number
        quantity:
          type: integer
        delivery_days_min:
          type: integer
        delivery_days_max:
          type: integer
        warehouse_city:
          type: string
        returnable:
          type: boolean
        warranty_days:
          type: integer
        fitment_basis:
          type: string
        stock_confirmed:
          type: boolean
        scores:
          type: object
        risk_flags:
          type: array
          items:
            type: string
    SearchReport:
      type: object
      properties:
        request_id:
          type: string
        generated_at:
          type: string
        summary:
          type: string
        recommendations:
          type: object
        offers_ranked:
          type: array
          items:
            $ref: '#/components/schemas/Offer'
        risks:
          type: array
          items:
            type: string
    OrderFeedback:
      type: object
      properties:
        request_id:
          type: string
        offer_id:
          type: string
        ordered:
          type: boolean
        fitment_ok:
          type: boolean
        delay_days:
          type: integer
        return_needed:
          type: boolean
        notes:
          type: string
