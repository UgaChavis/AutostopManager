version: 1
city_default: "Красноярск"

marketplace_templates:
  exact_oem:
    - "{oem}"
    - "{oem} {brand}"
    - "{oem} {vehicle_model}"
  part_vehicle:
    - "{part_name} {make} {model} {body_code}"
    - "{part_name} {make} {model} {engine_code}"
    - "{part_name} {body_code} {side}"
  used_contract:
    - "контрактный {part_name} {make} {model}"
    - "б/у {part_name} {make} {model}"
    - "разбор {make} {model} {body_code} {part_name}"
  aggregate:
    - "двигатель {engine_code} {make}"
    - "коробка {transmission_code} {make} {model}"
    - "редуктор {make} {model} {body_code}"
  electronics:
    - "блок {module_name} {part_number}"
    - "ЭБУ {engine_code} {part_number}"
    - "{part_number} BMW блок"

map_search_templates:
  - "автозапчасти {city}"
  - "авторазбор {city}"
  - "контрактные запчасти {city}"
  - "запчасти BMW {city}"
  - "кузовные запчасти {city}"
  - "двигатели контрактные {city}"
  - "коробки передач контрактные {city}"
  - "автоэлектроника блоки управления {city}"
  - "турбины ремонт {city}"

phone_script_templates:
  stock_confirm: "Здравствуйте. Нужна деталь {part_name}, номер {article}, автомобиль {vehicle}. Она физически есть в наличии?"
  photo_marking: "Можете отправить фото маркировки крупно и фото креплений?"
  return_policy: "Если по номеру/VIN не подойдет, возврат возможен? На каких условиях?"
