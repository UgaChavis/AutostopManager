[project]
name = "autostop-manager"
version = "0.1.0"
description = "Headless manager memory layer for AutoStop CRM agents"
requires-python = ">=3.11"
dependencies = [
    "av>=14,<17",
    "defusedxml>=0.7.1,<1.0.0",
    "mcp>=1.28.1,<2",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
    "coverage[toml]>=7.6",
    "mypy>=1.14",
    "playwright>=1.60",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "requests>=2.32",
    "ruff>=0.8",
]
telegram = [
    "faster-whisper>=1.1,<2",
    "qrcode[pil]>=8,<9",
    "telethon>=1.40,<2",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["autostop_manager*"]
exclude = ["data*", "docs*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "B",
    "BLE",
    "C4",
    "C90",
    "DTZ",
    "E",
    "F",
    "LOG",
    "PIE",
    "RET",
    "RSE",
    "RUF",
    "SIM102",
    "SIM105",
    "SIM118",
    "UP",
]
ignore = ["E501", "RUF001", "SIM108"]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_configs = true

[tool.coverage.run]
branch = true
source = ["autostop_manager"]

[tool.coverage.report]
fail_under = 82
show_missing = true
skip_covered = true
