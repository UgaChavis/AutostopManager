[project]
name = "autostop-manager"
version = "0.1.0"
description = "Headless manager memory layer for AutoStop CRM agents"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["autostop_manager*"]
exclude = ["data*", "docs*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
