[project]
name = "autostop-manager"
version = "0.1.0"
description = "Headless manager memory layer for AutoStop CRM agents"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mcp==1.28.1",
]

[project.optional-dependencies]
dev = [
    "coverage==7.14.1",
    "mypy==2.2.0",
    "pip-audit==2.10.1",
    "pip-tools==7.5.3",
    "playwright==1.60.0",
    "pre-commit==4.6.0",
    "pytest==9.0.3",
    "requests==2.34.2",
    "ruff==0.15.15",
    "vulture==2.16",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["autostop_manager*"]
exclude = ["data*", "docs*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["autostop_manager"]

[tool.coverage.report]
show_missing = true
skip_covered = true
